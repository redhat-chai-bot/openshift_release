chain:
  as: sno-topology-transition
  steps:
  - ref: sno-topology-transition-execute
  - ref: sno-topology-transition-wait
  documentation: |-
    The SNO Topology Transition chain orchestrates the transition from a Single Node OpenShift
    cluster to an HA Compact topology. It first executes the transition by scaling the control
    plane to three nodes, then waits for the topology change to complete and all operators
    to reconcile.

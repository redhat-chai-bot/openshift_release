base_images:
  nested-podman:
    name: nested-podman
    namespace: ci
    tag: latest
  ocm-cli:
    name: ocm-cli
    namespace: ci
    tag: latest
  rosa-aws-cli:
    name: rosa-aws-cli
    namespace: ci
    tag: latest
  rosa-e2e:
    name: rosa-e2e
    namespace: ci
    tag: latest
build_root:
  from_repository: true
  use_build_cache: true
images:
  items:
  - dockerfile_path: Dockerfile.control-plane
    to: control-plane-operator
prowgen:
  enable_secrets_store_csi_driver: true
releases:
  latest:
    candidate:
      product: ocp
      stream: nightly
      version: "4.22"
resources:
  '*':
    limits:
      memory: 4Gi
    requests:
      cpu: 100m
      memory: 200Mi
tests:
- as: rosa-hcp-cpo-e2e-staging-stable-4-22
  cron: 0 8 * * *
  steps:
    allow_best_effort_post_steps: true
    cluster_profile: rosa-e2e-01
    env:
      CHANNEL_GROUP: stable
      CLUSTER_SECTOR: hypershift-ci
      ENABLE_BILLING_ACCOUNT: "yes"
      HOSTED_CP: "true"
      LABEL_FILTER: Platform:HCP
      OCM_LOGIN_ENV: staging
      OPENSHIFT_VERSION: "4.22"
      REGION: us-west-2
      REPLICAS: "3"
    post:
    - ref: rosa-gap-analysis-api-resources-and-crd
    - ref: rosa-gap-analysis-critical-alerts
    - ref: rosa-gap-analysis-cluster-install-delete-metrics
    - ref: rosa-control-plane-operator-restore
    - chain: rosa-cluster-deprovision
    - chain: rosa-sts-oidc-config-delete
    - ref: rosa-e2e-cleanup-vpc
    - ref: aws-deprovision-stacks
    - chain: rosa-gather-hcp-diagnostics
    pre:
    - chain: rosa-aws-sts-hcp-provision
    - ref: rosa-cluster-wait-ready-hosted-cp
    - ref: rosa-cluster-wait-ready-nodes
    - ref: rosa-cluster-credentials-hypershift-mgmt
    - ref: rosa-control-plane-operator-deploy-pr
    workflow: rosa-e2e-hcp
  timeout: 3h0m0s
zz_generated_metadata:
  branch: main
  org: openshift
  repo: hypershift
  variant: rosa-cpo-e2e
